[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rigol-dg1022-arbdraw-adapter"
version = "0.1.0"
description = "ArbDraw adapter foundation for the Rigol DG1022 function generator"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["PyVISA>=1.13", "PyVISA-py>=0.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."arbdraw.instrument_adapters"]
rigol-dg1022 = "rigol_dg1022.bridge:send_waveform"

[tool.setuptools]
py-modules = ["awg_import", "data_catalog"]

[tool.setuptools.packages.find]
include = ["rigol_dg1022*"]

[tool.setuptools.package-data]
rigol_dg1022 = ["defaults.toml", "specs.toml"]
